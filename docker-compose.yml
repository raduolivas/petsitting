services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pawbnb
      POSTGRES_PASSWORD: pawbnb
      POSTGRES_DB: pawbnb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawbnb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: change-me-to-a-long-random-string
      DATABASE_URL: postgresql+psycopg2://pawbnb:pawbnb@db:5432/pawbnb
      FORCE_HTTPS: "0"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask --app wsgi:app db upgrade &&
             flask --app wsgi:app seed || true &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 60 wsgi:app"

volumes:
  pgdata:
