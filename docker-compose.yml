services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pawbnb
      POSTGRES_PASSWORD: pawbnb
      POSTGRES_DB: pawbnb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawbnb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: change-me-to-a-long-random-string
      DATABASE_URL: postgresql+psycopg2://pawbnb:pawbnb@db:5432/pawbnb
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      FORCE_HTTPS: "0"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-Pawbnb <noreply@pawbnb.local>}
      MAIL_SUPPRESS_SEND: ${MAIL_SUPPRESS_SEND:-0}
    volumes:
      - uploads:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "flask --app wsgi:app db upgrade &&
             flask --app wsgi:app seed || true &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 60 wsgi:app"

volumes:
  pgdata:
  uploads:
