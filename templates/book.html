{% extends "base.html" %}
{% block title %}Book {{ profile.user.name }} – Pawbnb{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-10">
    <div class="bg-white rounded-2xl border border-stone-100 p-8">
        <h1 class="text-xl font-bold mb-1">Request booking</h1>
        <p class="text-stone-500 text-sm mb-6">with {{ profile.user.name }} · {{ profile.city }}</p>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium mb-1">Service type</label>
                <select name="service_type" required class="w-full border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-paw-300">
                    {% if profile.offers_boarding %}<option value="boarding">🏠 Boarding – €{{ '%.0f'|format(profile.price_boarding_day) }}/day</option>{% endif %}
                    {% if profile.offers_walking %}<option value="walking">🚶 Walking – €{{ '%.0f'|format(profile.price_walking_hour) }}/hour</option>{% endif %}
                    {% if profile.offers_daycare %}<option value="daycare">☀️ Daycare – €{{ '%.0f'|format(profile.price_daycare_day) }}/day</option>{% endif %}
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Start date</label>
                    <input type="date" name="start_date" required class="w-full border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-paw-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">End date</label>
                    <input type="date" name="end_date" class="w-full border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-paw-300">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Dog’s name</label>
                <input type="text" name="dog_name" required class="w-full border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-paw-300">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Breed</label>
                    <input type="text" name="dog_breed" class="w-full border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-paw-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Size</label>
                    <select name="dog_size" class="w-full border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-paw-300">
                        <option value="small">Small</option>
                        <option value="medium" selected>Medium</option>
                        <option value="large">Large</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Notes for the sitter</label>
                <textarea name="notes" rows="3" class="w-full border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-paw-300" placeholder="Special needs, medication, favorite toys..."></textarea>
            </div>

            <button type="submit" class="w-full bg-paw-500 hover:bg-paw-600 text-white font-semibold py-3 rounded-xl transition">
                Continue to payment
            </button>
        </form>
    </div>
</div>
{% endblock %}
