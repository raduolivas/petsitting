{% extends "base.html" %}
{% block title %}Log in – Pawbnb{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white rounded-2xl shadow-sm border border-stone-100 p-8">
        <h1 class="text-2xl font-bold text-center mb-2">Welcome back</h1>
        <p class="text-center text-stone-500 text-sm mb-8">Log in to your Pawbnb account</p>

        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" required class="w-full border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-paw-300 focus:border-paw-400">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" required class="w-full border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-paw-300 focus:border-paw-400">
            </div>

            <button type="submit" class="w-full bg-paw-500 hover:bg-paw-600 text-white font-semibold py-3 rounded-xl transition">
                Log in
            </button>
        </form>

        <div class="mt-6 p-4 bg-stone-50 rounded-xl text-sm text-stone-600">
            <p class="font-medium mb-1">Demo accounts:</p>
            <p>Sitter: maria@example.com / demo123</p>
            <p>Owner: owner@example.com / demo123</p>
        </div>

        <p class="text-center text-sm text-stone-500 mt-6">
            No account yet? <a href="{{ url_for('auth.register') }}" class="text-paw-600 font-medium hover:underline">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
